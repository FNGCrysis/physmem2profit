name: Build Physmem2profit Server

on:
  push:
    branches: [ public ]
  pull_request:
    branches: [ public ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install .NET Framework 4.5.2 Developer Pack
      run: |
        $url = "https://download.microsoft.com/download/E/2/1/E21644B5-2DF2-47C2-91BD-63C560427900/NDP452-KB2901907-x86-x64-AllOS-ENU.exe"
        $output = "NDP452-DevPack.exe"
        Invoke-WebRequest -Uri $url -OutFile $output
        Start-Process -FilePath $output -ArgumentList "/q /norestart" -Wait
      shell: powershell

    - name: Restore NuGet packages
      run: nuget restore server/Physmem2profit.sln

    - name: Build server solution
      run: msbuild server/Physmem2profit.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutDir=..\bin\Release\

    - name: Upload server build artifact
      uses: actions/upload-artifact@v4
      with:
        name: physmem2profit-server
        path: server/bin/Release/
        retention-days: 7
